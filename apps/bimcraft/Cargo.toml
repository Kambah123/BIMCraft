[package]
name = "bimcraft"
description = "BIMCraft desktop app"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version = "1.95"
publish = false

[lints]
workspace = true

[features]
# Reads Revit's .rvt and .rfa files. That code is ported from rvt-rs and is Apache-2.0 only (docs/rvt-provenance.md),
# so a build without it, which keeps the repository's MIT OR Apache-2.0, is `--no-default-features`.
default = ["rvt", "dwg", "native-services"]
rvt = ["dep:bimcraft-rvt"]
# Reads DWG drawings in `import_cad`, through bimcraft-dwg, which uses acadrust (MPL-2.0, unmodified; NOTICE).
dwg = ["dep:bimcraft-dwg"]
# Desktop updater and AI assistant (ureq + rustls + ring). Off for a wasm / browser build.
native-services = ["bimcraft-ui-egui/native-services", "dep:bimcraft-update", "dep:bimcraft-assistant"]

[dependencies]
bimcraft-i18n = { workspace = true }
bimcraft-core = { workspace = true }
bimcraft-plugin = { workspace = true }
bimcraft-rvt = { workspace = true, optional = true }
bimcraft-dwg = { workspace = true, optional = true }
bimcraft-ui-egui = { workspace = true, default-features = false }
bimcraft-update = { workspace = true, optional = true }
bimcraft-assistant = { workspace = true, optional = true }
eframe = { workspace = true }
rfd = { workspace = true }
serde_json = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Blob",
    "Document",
    "Event",
    "EventTarget",
    "HtmlCanvasElement",
    "HtmlInputElement",
    "HtmlElement",
    "File",
    "FileList",
    "Window",
    "console",
] }
# eframe's wasm wgpu dep is `std` only; this turns on the WebGL2 backend so a browser
# without a WebGPU adapter still starts (egui-wgpu already prefers WebGPU, then GL).
wgpu = { version = "30", default-features = false, features = ["std", "webgl"] }

[dev-dependencies]
# Synthetic Revit-shaped files for the test of the reader the window is given.
bimcraft-rvt = { workspace = true, features = ["testing"] }

[target.'cfg(target_os = "macos")'.dependencies]
# Finder's double-click, Open With and drops on the Dock icon arrive as Apple events, which winit doesn't
# hand on. Handling them needs Objective-C, so unsafe, which this workspace forbids: this small crate (the
# one PhotoCraft uses) does it behind a safe API. Pinned exactly: read the diff before bumping.
fmv-macos-events = "=0.1.0"
