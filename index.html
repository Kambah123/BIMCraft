<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BIMCraft</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="favicon.ico" sizes="any" />
    <link data-trunk rel="copy-file" href="favicon.svg" />
    <link data-trunk rel="copy-file" href="favicon.ico" />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #1b1b1b;
        overflow: hidden;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
    </style>
    <link
      data-trunk
      rel="rust"
      href="apps/bimcraft/Cargo.toml"
      data-bin="bimcraft"
      data-cargo-no-default-features
      data-wasm-opt="z"
    />
  </head>
  <body>
    <canvas id="the_canvas_id"></canvas>
  </body>
</html>
