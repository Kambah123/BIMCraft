[alias]
i18n = "run --quiet -p bimcraft-i18n --features tooling --"

# getrandom 0.3 does not compile for wasm32-unknown-unknown unless rustc is also given this
# cfg; the crate's wasm_js feature alone is not enough.
# https://docs.rs/getrandom/0.3.4/#webassembly-support
[target.wasm32-unknown-unknown]
rustflags = ["--cfg", "getrandom_backend=\"wasm_js\""]

