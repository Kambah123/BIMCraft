[package]
name = "bimcraft-ui-egui"
description = "BIMCraft's desktop front end in egui: a thin shell over the core's Session"
version.workspace = true
edition.workspace = true
license.workspace = true
# egui 0.36 needs Rust 1.95; the core and the CLI still build with 1.90.
rust-version = "1.95"

[lints]
workspace = true

[features]
default = ["native-services"]
# Desktop updater and AI assistant (ureq + rustls + ring). Off for wasm.
native-services = ["dep:bimcraft-update", "dep:bimcraft-assistant"]

[dependencies]
bimcraft-i18n = { workspace = true }
bimcraft-core = { workspace = true }
bimcraft-plugin = { workspace = true }
bimcraft-update = { workspace = true, optional = true }
bimcraft-assistant = { workspace = true, optional = true }
serde_json = { workspace = true }
egui = { workspace = true }
eframe = { workspace = true }
pollster = "1"
rayon = { workspace = true }
bytemuck = "1"
rfd = { workspace = true }
sys-locale = { workspace = true }


[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Window",
    "Document",
    "Element",
    "HtmlElement",
    "HtmlAnchorElement",
    "Blob",
    "BlobPropertyBag",
    "Url",
    "Storage",
    "IdbFactory",
    "IdbDatabase",
    "IdbOpenDbRequest",
    "IdbRequest",
    "IdbTransaction",
    "IdbTransactionMode",
    "IdbObjectStore",
    "DomStringList",
    "Event",
    "EventTarget",
    "console",
] }

# The 3D mouse (`spacemouse.rs`), read from its HID reports through hidapi's own Windows backend: pure Rust, MIT.
[target.'cfg(windows)'.dependencies]
hidapi = { version = "2.6.7", default-features = false, features = ["windows-native"] }

[dev-dependencies]
tempfile = { workspace = true }
egui_kittest = { workspace = true }
bimcraft-update = { workspace = true, features = ["testing"] }
bimcraft-assistant = { workspace = true, features = ["testing"] }

[build-dependencies]
bimcraft-i18n = { workspace = true, features = ["catalog"] }
